<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка | Лисёнок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="/assets/css/site.css?v=3" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: { brand: { green: '#4A5D4E', hover: '#3A4A3D', light: '#E2E8F0' } }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen">
    <main class="max-w-3xl mx-auto px-6 md:px-8 pt-10 pb-20">
        <h1 class="text-3xl font-semibold mb-6">Техподдержка</h1>
        <p id="support-gate" class="hidden text-sm opacity-80 mb-6">Чтобы написать в поддержку, войдите на сайт.</p>
        <div id="support-box" class="hidden space-y-8">
            <form id="ticket-form" class="space-y-3">
                <input name="subject" required placeholder="Тема" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-sm">
                <textarea name="message" required placeholder="Сообщение" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-sm min-h-28"></textarea>
                <button class="px-6 py-3 bg-brand-green rounded-lg text-sm font-medium">Отправить</button>
            </form>
            <div id="tickets" class="space-y-6"></div>
        </div>
    </main>
    <script src="/assets/js/app.js?v=3"></script>
    <script>
        boot("support");

        async function loadTickets() {
            if (!session?.token) {
                document.getElementById("support-gate").classList.remove("hidden");
                return;
            }
            document.getElementById("support-box").classList.remove("hidden");
            const tickets = await fetch("/api/support/tickets", { headers: authHeaders() }).then((r) => r.json());
            document.getElementById("tickets").innerHTML = tickets.map((ticket) => `
                <div class="border-b border-white/10 pb-4">
                    <p class="font-medium mb-2">${ticket.subject} · ${ticket.user_email}</p>
                    ${(ticket.messages || []).map((msg) => `
                        <p class="text-sm mb-1 ${msg.is_admin ? "opacity-100" : "opacity-80"}">
                            <span class="opacity-60">${msg.is_admin ? "Админ" : "Вы"}:</span> ${msg.text}
                        </p>
                    `).join("")}
                    <form class="reply-form mt-3 flex gap-2" data-id="${ticket.id}">
                        <input name="text" required placeholder="Ответ" class="flex-1 bg-black/30 border border-white/20 rounded-lg p-2 text-sm">
                        <button class="px-4 py-2 bg-brand-green rounded-lg text-sm">Ответить</button>
                    </form>
                </div>
            `).join("") || "<p class='opacity-70 text-sm'>Обращений пока нет</p>";
            document.querySelectorAll(".reply-form").forEach((form) => {
                form.addEventListener("submit", async (event) => {
                    event.preventDefault();
                    await fetch(`/api/support/tickets/${form.dataset.id}/messages`, {
                        method: "POST",
                        headers: authHeaders(),
                        body: JSON.stringify({ text: new FormData(form).get("text") })
                    });
                    loadTickets();
                });
            });
        }

        document.getElementById("ticket-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = new FormData(event.target);
            await fetch("/api/support/tickets", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify({ subject: form.get("subject"), message: form.get("message") })
            });
            event.target.reset();
            loadTickets();
        });

        loadTickets();
    </script>
</body>
</html>
